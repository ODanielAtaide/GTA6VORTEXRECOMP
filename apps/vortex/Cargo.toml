[package]
name = "vortex"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vortex-core.workspace = true
vortex-pe.workspace = true
vortex-loader.workspace = true
vortex-hle.workspace = true
vortex-shader = { workspace = true, features = ["host"] }
vortex-game.workspace = true
vortex-vulkan = { path = "../../crates/vortex-vulkan", optional = true }
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

[features]
# Experimental Vulkan host library, separate from the legacy title renderer.
vulkan = ["dep:vortex-vulkan", "vortex-hle/vulkan"]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "vortex-core/diagnostics",
    "vortex-hle/diagnostics",
    "vortex-loader/diagnostics",
    "vortex-shader/diagnostics",
]

[lints]
workspace = true
