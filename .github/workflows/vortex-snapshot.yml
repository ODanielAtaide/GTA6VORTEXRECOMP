name: Vortex editable snapshot
on:
  push:
    paths:
      - 'src-victory/**'
      - '.github/workflows/vortex-snapshot.yml'
  pull_request:
    paths:
      - 'src-victory/**'
      - '.github/workflows/vortex-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-victory
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: PE regression tests
        run: cargo test --locked -p victory-pe
      - name: Full synthetic suite
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p victory
      - name: Verify CLI
        run: .\target\release\victory.exe --help
