name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache regression tests
        if: hashFiles('crates/vortex-pipeline/Cargo.toml') != ''
        run: cargo test --locked -p vortex-pipeline
      - name: Texture regression tests
        if: hashFiles('crates/vortex-formats/Cargo.toml') != ''
        run: cargo test --locked -p vortex-formats texture::tests
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build Vortex executable
        run: cargo build --release -p vortex --locked
      - name: Verify Vortex CLI
        run: .\target\release\vortex.exe --help
      - name: Check performance profile
        run: cargo check --profile performance -p vortex --locked
