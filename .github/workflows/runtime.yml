name: Runtime baseline
on:
  push:
    paths:
      - '.github/workflows/runtime.yml'
      - '.gitmodules'
      - 'vendor/victory'
  pull_request:
    paths:
      - '.github/workflows/runtime.yml'
      - '.gitmodules'
      - 'vendor/victory'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-baseline:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vendor/victory
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record baseline
        run: git rev-parse HEAD
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Test synthetic workloads
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --release -p victory --locked
      - name: Build diagnostics
        run: cargo build --profile diag -p victory --features diagnostics --locked
