# Copy to `vortex.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VORTEX_CONFIG selects a different config file.

[paths]
# Your own dump of Grand Theft Auto VI.     env: VORTEX_GAME_DIR
game_dir = 'D:\vortex-data\game'

# Derived data. Default: %LOCALAPPDATA%\vortex\cache.   env: VORTEX_CACHE_DIR
# cache_dir = 'D:\vortex-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\vortex\data.   env: VORTEX_DATA_DIR
# data_dir = 'D:\vortex-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: VORTEX_TEST_TITLES (separated by ';')
test_titles = []
